<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | Lendme</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
<header class="top">
  <a class="logo" href="index.html"><img src="logo.svg" alt="" width="28" height="28"> Lendme</a>
  <nav id="nav"></nav>
</header>
<main class="narrow">
<h1>Log in</h1>
<form id="loginForm" class="form">
  <label for="email">Email</label>
  <input id="email" type="email" required autocomplete="email">
  <label for="password">Password</label>
  <input id="password" type="password" required autocomplete="current-password">
  <button class="btn solid" type="submit">Log in</button>
  <p id="msg" class="msg" role="alert"></p>
</form>
<p>New to Lendme? <a href="register.html">Create an account</a></p>
</main>
<footer><strong>Lendme</strong> &middot; Study now. Pay back later.<br><small>Contact: <a href="mailto:lendme@gmail.com">lendme@gmail.com</a> &middot; &copy; 2026 Lendme. Concept project.</small></footer>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
