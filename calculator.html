<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repayment calculator | Lendme</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="calculator">
<header class="top">
  <a class="logo" href="index.html"><img src="logo.svg" alt="" width="28" height="28"> Lendme</a>
  <nav id="nav"></nav>
</header>
<main class="narrow">
<h1>Repayment calculator</h1>
<p class="note">Interest is 30% per year, calculated monthly on the balance. An estimate only.</p>
<form id="calcForm" class="form">
  <label for="cAmt">Amount (BWP)</label>
  <input id="cAmt" type="number" min="1" step="any" inputmode="decimal" required>
  <label for="cMonths">Repayment period (months)</label>
  <input id="cMonths" type="number" min="1" step="1" inputmode="numeric" required>
  <button class="btn solid" type="submit">Calculate</button>
</form>
<div class="card" id="cOut" aria-live="polite">Your result will show here.</div>
</main>
<footer><strong>Lendme</strong> &middot; Study now. Pay back later.<br><small>Contact: <a href="mailto:lendme@gmail.com">lendme@gmail.com</a> &middot; &copy; 2026 Lendme. Concept project.</small></footer>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
